# Jarvis default configuration.
# Don't edit this file for personal settings — create config/local.toml instead
# (same keys; only include what you want to change). Env vars override both,
# e.g.  JARVIS_MODELS__ROLES__CHAT="ollama:qwen3:8b"

[app]
name = "Jarvis"
data_dir = "data"          # logs, and later: database, memory, cache
system_prompt = """You are Jarvis, a concise, capable personal assistant running locally on the user's PC.

Style: answer directly and briefly unless asked for detail. Speak naturally — your replies may be read aloud.

Tools: you can act on this PC only through the tools you're given (files, opening apps, files and websites, system info, a calculator, notes, reminders). You can read files anywhere on the PC except private data; changes need the user's approval, which the system asks for automatically — just call the tool. Use a tool when it's needed to answer or act; don't use tools for things you can answer directly. After using tools, briefly tell the user what happened.
- Long-term memory: facts you remember about the user appear below and in <memory> blocks. Use them naturally when relevant; don't recite them unprompted. When the user asks you to remember something about themselves, use memory_save; when they correct it, memory_update; when they ask you to forget, memory_forget (with the #id). When asked what you know about them, use memory_search with an empty query.
- Your notes and reminders are also your own memory (notes are for codes, numbers and reference info). When the user asks about something they saved or told you to remember, search your notes before saying you don't know.
- The user's Obsidian vault is their second brain (notes they write, journal, pages on people and projects). When they ask what they wrote or planned about something, use vault_search.
- Use calculate for ALL arithmetic, even simple sums — never do math in your head.
- "Open X" means the app: use apps_open. Only open the website if the user asks for the website or the app isn't installed.
- When a tool is needed, call it right away in this same reply. Never say "I'll check" or "one moment" without calling the tool — there is no later.

Honesty rules (never break these):
- Only state facts about the user that they told you in this conversation or that a tool or your memory returned (including your notes). If you still don't know, say so plainly.
- You have no internet access and no knowledge of events after your training. If asked about recent or future events, say you don't know rather than guessing. (web_search only opens a browser; you can't read the results.)
- Never claim you did something unless a tool result confirms it. If there's no tool for a request (like smart-home devices or sending messages), say you can't do that yet.
- If the user corrects an earlier request, change what you already did (e.g. reminders_update) instead of creating a duplicate.
- If you're unsure, say so. A short honest "I don't know" is better than a confident wrong answer."""

[logging]
level = "INFO"             # file log level
console_level = "WARNING"  # keep the chat window clean
json_file = true

[models]
# role -> "<provider>:<model>". Code asks for a role; config decides the model.
# Chosen from Phase 1 evals: qwen3:8b beat qwen3:14b (34/35 vs 31/35, no
# hallucinations, 146 vs 87 tok/s) and leaves ~4 GB more VRAM free.
roles = { chat = "ollama:qwen3:8b", embed = "ollama:qwen3-embedding:0.6b" }

# Per-role generation options. `think = false` skips the reasoning phase of
# thinking models (much faster first answer). Toggle live in chat with /think on.
[models.options.chat]
think = false
temperature = 0.7

[memory]
enabled = true           # long-term memory about you, across conversations
auto_learn = true        # pick up facts from what you say (in the background)
top_k = 5                # memories recalled per message
min_score = 0.5          # how similar a memory must be to be recalled (0..1)
core_limit = 15          # "profile" facts (name, city, work) always included
dedupe_threshold = 0.9   # saving something this similar updates instead of duplicating

[conversation]
context_tokens = 8192      # prompt budget; also sent to Ollama as num_ctx (more = more VRAM)
reserve_tokens = 1024      # room kept free for the reply
include_datetime = true    # tell the model the current date/time

[tools]
enabled = true
max_steps = 6              # max tool round-trips per reply
disabled = []              # e.g. ["files_delete"] to remove a tool entirely
notifications = true       # Windows toast notifications for reminders

[tools.files]
# Your folders: Jarvis reads freely; creating/changing/deleting asks first.
# Known names (Documents, Desktop, Downloads, Pictures, Music, Videos) are resolved
# via Windows, so OneDrive folders work. "Jarvis" = this project folder.
roots = ["Documents", "Desktop", "Downloads", "Jarvis"]
read_anywhere = true       # read-only access to the rest of the PC
outside_writes = "ask"     # changing files elsewhere: "ask" (every time, no "always") | "deny"
# Always blocked (not configurable here): private data like browser passwords, SSH
# keys, Windows credentials; writes to Windows/Program Files and Jarvis's own
# config/ and data/ folders. See no_access / no_write in src/jarvis/core/config.py.
max_read_chars = 20000

# allow = run without asking · ask = ask you first · deny = never
[tools.permissions]
safe = "allow"             # read-only: list/search/read files, system info, list notes
change = "ask"             # creates or changes something
destructive = "ask"        # overwrite / delete — always asks, "always allow" not offered

[tools.permissions.overrides]
# Per-tool: allow | ask | deny. Built-in defaults already allow notes_add,
# reminders_set/update/cancel, apps_open, web_open and web_search without asking.
# Examples:
# files_write = "allow"    # stop asking before creating new files
# apps_open = "ask"        # ask before opening apps

[voice]
# `jarvis voice`: tap the hotkey, speak, and Jarvis answers out loud.
hotkey = "ctrl_r"          # tap Right Ctrl on its own (shortcuts like Right Ctrl+C don't count).
                           # Or a combo: "<ctrl>+<alt>+j". Key names: pynput's Key.* (f9, pause, …)
# Hearing — faster-whisper on the GPU (falls back to the CPU if CUDA isn't working)
stt_model = "distil-large-v3.5"   # English, fast & accurate (~1.5 GB VRAM). Multilingual: "large-v3-turbo"
stt_device = "auto"        # auto | cuda | cpu
language = "en"
hotwords = "Jarvis"        # names/jargon Whisper should expect, e.g. "Jarvis Exinent Priya"
silence_ms = 700           # pause this long and Jarvis stops listening (raise if it cuts you off)
start_timeout_s = 6.0      # stop listening if you don't start talking within this
max_listen_s = 30.0
vad_threshold = 0.5        # raise (0.6–0.7) if background noise keeps it listening
input_device = ""          # "" = Windows default mic; see: jarvis voice devices
# Speaking — Kokoro, runs on the CPU
speak = true
tts_voice = "bm_george"    # British male. Hear the others: jarvis voice voices --play
tts_speed = 1.0            # 0.8 slower … 1.3 faster
tts_model = "kokoro-v1.0.onnx"    # or "kokoro-v1.0.fp16.onnx" (half the download)
output_device = ""
earcons = true             # soft beeps: listening / got it / heard nothing

[vault]
# Obsidian "second brain": memory, notes, reminders and conversations as Markdown pages
# you can read and edit. Your edits flow back into Jarvis. See docs/phase-4.5.md.
enabled = true
path = "Documents/obsidian_notes"   # "Documents/…" follows OneDrive; or a full path
poll_s = 3.0               # sync every few seconds while Jarvis runs
quiet_s = 4.0              # a file you just edited is left alone this long
conversations = true       # Conversations/ — a page per chat
journal = true             # Journal/ — a page per day
inbox = true               # Inbox/ — drop files in, Jarvis learns from them and files them
search = true              # vault_search: Jarvis searches your notes by meaning
search_conversations = false
user_name = "Adi"          # your label in conversation pages

[providers.ollama]
base_url = "http://127.0.0.1:11434"
keep_alive = "30m"         # how long the model stays in VRAM after last use
timeout_s = 120
# think = false            # provider-wide default; per-role [models.options.*] wins

[server]
host = "127.0.0.1"         # local only. Don't expose to your network without auth.
port = 8765
