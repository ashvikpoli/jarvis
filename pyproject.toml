[project]
name = "jarvis"
version = "0.6.0"
description = "A local-first personal AI assistant"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "rich>=13.7",
    "psutil>=7.2.2",
    "send2trash>=2.1.0",
    # Phase 4 — voice
    "numpy>=2.0",
    "faster-whisper>=1.2",          # speech-to-text (CTranslate2)
    "onnxruntime>=1.20",            # Kokoro TTS + Silero VAD
    "phonemizer>=3.3",              # text -> phonemes for Kokoro (via espeak-ng)
    "espeakng-loader>=0.2.4",       # bundled espeak-ng library + data
    "sounddevice>=0.5",             # microphone + speakers
    "pynput>=1.8",                  # global push-to-talk hotkey
    # CUDA libraries for GPU speech recognition (Windows; ~1.2 GB, downloaded once)
    "nvidia-cublas-cu12>=12.4; sys_platform == 'win32'",
    "nvidia-cudnn-cu12>=9.1,<10; sys_platform == 'win32'",
]

[project.scripts]
jarvis = "jarvis.interfaces.cli:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/jarvis"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ASYNC"]

[tool.ruff.lint.per-file-ignores]
"src/jarvis/tools/notify.py" = ["E501"]  # embedded PowerShell script
"src/jarvis/memory/extractor.py" = ["E501"]  # prompt text
